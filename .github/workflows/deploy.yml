name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify Scientific Enchantment assets at Pages URL
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os
          import time
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          from urllib.request import urlopen

          root = os.environ['PAGES_URL'].rstrip('/') + '/'
          page_url = urljoin(root, 'preview/enchanted/')

          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.css = []
                  self.images = []

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == 'link' and 'stylesheet' in values.get('rel', '').split():
                      self.css.append(values['href'])
                  if tag == 'img':
                      self.images.append(values['src'])

          def fetch(url):
              with urlopen(url, timeout=15) as response:
                  content = response.read()
                  assert response.url.startswith(root), f'Unexpected redirect: {response.url}'
                  assert response.status == 200, f'{url}: HTTP {response.status}'
                  return content, response.headers.get_content_type()

          for attempt in range(24):
              try:
                  html, content_type = fetch(page_url)
                  assert content_type == 'text/html'
                  assets = Assets()
                  assets.feed(html.decode('utf-8'))
                  assert len(assets.css) >= 1, 'Missing stylesheet'
                  assert len(assets.images) == 7, f'Expected seven images, found {len(assets.images)}'
                  for path in assets.css:
                      content, content_type = fetch(urljoin(root, path))
                      assert content_type == 'text/css' and len(content) > 1000, path
                  for path in assets.images:
                      content, content_type = fetch(urljoin(root, path))
                      assert content_type == 'image/png' and len(content) > 100000, path
                  print(f'Verified {page_url}: {len(assets.css)} CSS file(s), seven original PNGs')
                  break
              except Exception as error:
                  if attempt == 23:
                      raise
                  print(f'Pages assets not ready yet ({error}); retrying in 5 seconds')
                  time.sleep(5)
          PY
