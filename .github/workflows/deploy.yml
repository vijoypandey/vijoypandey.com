name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify Scientific Enchantment assets at Pages URL
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os
          import time
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          from urllib.request import urlopen

          root = os.environ['PAGES_URL'].rstrip('/') + '/'
          pages = {
              '': 9,
              'about/personal/': 0,
              'about/work/': 0,
              'preview/enchanted/': 7,
              'preview/enchanted-v2/': 9,
              'emergent-superintelligence/': 1,
              'preview/enchanted-v2/boltzmann-computing/': 2,
              'preview/enchanted-v2/quantum-computing/': 2,
              'preview/enchanted-v2/physical-ai/': 2,
          }

          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.css = []
                  self.images = []

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == 'link' and 'stylesheet' in values.get('rel', '').split():
                      self.css.append(values['href'])
                  if tag == 'img':
                      self.images.append(values['src'])

          def fetch(url):
              with urlopen(url, timeout=15) as response:
                  content = response.read()
                  assert response.url.startswith(root), f'Unexpected redirect: {response.url}'
                  assert response.status == 200, f'{url}: HTTP {response.status}'
                  return content, response.headers.get_content_type()

          for attempt in range(24):
              try:
                  stylesheets = set()
                  images = set()
                  for path, expected_images in pages.items():
                      page_url = urljoin(root, path)
                      html, content_type = fetch(page_url)
                      assert content_type == 'text/html', page_url
                      assets = Assets()
                      assets.feed(html.decode('utf-8'))
                      assert assets.css, f'Missing stylesheet: {page_url}'
                      assert len(assets.images) == expected_images, (
                          f'{page_url}: expected {expected_images} images, found {len(assets.images)}'
                      )
                      stylesheets.update(assets.css)
                      images.update(assets.images)
                  for path in stylesheets:
                      content, content_type = fetch(urljoin(root, path))
                      assert content_type == 'text/css' and len(content) > 1000, path
                  for path in images:
                      content, content_type = fetch(urljoin(root, path))
                      assert content_type == 'image/png' and len(content) > 100000, path
                  print(f'Verified {len(pages)} Pages URLs, {len(stylesheets)} CSS file(s), and {len(images)} original PNGs')
                  break
              except Exception as error:
                  if attempt == 23:
                      raise
                  print(f'Pages assets not ready yet ({error}); retrying in 5 seconds')
                  time.sleep(5)
          PY
